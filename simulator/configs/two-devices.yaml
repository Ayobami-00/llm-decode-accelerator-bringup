# Logical devices with distinguishable capacities and placement labels.
# These are configured capabilities; no throughput or bandwidth is modeled.
schema_version: 1
architecture: emberx-v0

devices:
  - id: 0
    memory:
      sram_bytes: 1048576 # 1 MiB
      allocation_alignment_bytes: 64
    supported_dtypes: [float32]
    engines:
      matrix: 1
      vector: 1
      dma: 1
    topology:
      coordinates: [0, 0]
  - id: 1
    memory:
      sram_bytes: 2097152 # 2 MiB
      allocation_alignment_bytes: 64
    supported_dtypes: [float32]
    engines:
      matrix: 1
      vector: 1
      dma: 1
    topology:
      coordinates: [1, 0]

fabric:
  links: []
